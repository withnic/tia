name: TIA (Test Impact Analysis)

on:
  pull_request:

permissions:
  contents: read

jobs:
  tia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}:refs/heads/${{ github.event.pull_request.base.ref }}"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build tia
        run: go build -trimpath -o ./bin/tia ./cmd/tia

      - name: Select affected tests
        id: tia
        run: |
          base="${{ github.event.pull_request.base.ref }}"
          mkdir -p tia-report

          # Capture verbose output (stderr) and command (stdout)
          cmd=$(./bin/tia -base "${base}" -dirty=false -v 2> tia-report/details.txt) || true
          cat tia-report/details.txt >&2

          if [ -z "${cmd}" ]; then
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "## Test Impact Analysis" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No affected integration tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "affected=true" >> "$GITHUB_OUTPUT"
          echo "${cmd}" > tia-report/command.txt

      - name: Run affected tests
        if: steps.tia.outputs.affected == 'true'
        run: |
          base="${{ github.event.pull_request.base.ref }}"
          ./bin/tia -base "${base}" -dirty=false -exec -v 2>&1 | tee tia-report/test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Build summary
        if: steps.tia.outputs.affected == 'true'
        run: |
          echo "## Test Impact Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Parse test results into a table
          echo "| Test | Package | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|--------|" >> "$GITHUB_STEP_SUMMARY"

          grep -E '^\s*(seed|test) ' tia-report/details.txt | grep '^  *test ' | while read -r line; do
            name=$(echo "${line}" | sed -E 's/.*test [^ ]*\.([^ ]+) .*/\1/')
            pkg=$(echo "${line}" | sed -E 's/.*test ([^ ]*)\..*/\1/')
            # Check if this test passed in the output
            if grep -q "--- PASS: ${name}" tia-report/test-output.txt 2>/dev/null; then
              result="✅ pass"
            elif grep -q "--- FAIL: ${name}" tia-report/test-output.txt 2>/dev/null; then
              result="❌ fail"
            else
              result="⚠️ unknown"
            fi
            echo "| ${name} | ${pkg} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Show the command that was run
          echo "<details><summary>Command</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat tia-report/command.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed report
        if: steps.tia.outputs.affected == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tia-report
          path: tia-report/
          retention-days: 7

      - name: Fail if tests failed
        if: steps.tia.outputs.affected == 'true' && env.exit_code != '0'
        run: exit 1
